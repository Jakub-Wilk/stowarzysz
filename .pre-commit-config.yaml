default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^scripts/

  - repo: local
    hooks:
      # Backend (Astral tooling via uv)
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend ruff check --fix --force-exclude
        language: system
        types: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format --force-exclude
        language: system
        types: [python]
        files: ^backend/
      - id: ty
        name: ty check
        # --project makes ty read backend/pyproject.toml ([tool.ty]); it is run from the repo root.
        entry: uv run --project backend ty check --project backend
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

      # Backend v2 (Rust). Replaces the Python hooks above at cutover.
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path backend-rs/Cargo.toml --all -- --check
        language: system
        files: ^backend-rs/.*\.rs$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --manifest-path backend-rs/Cargo.toml --workspace --all-targets -- -D warnings
        language: system
        files: ^backend-rs/(.*\.rs|.*Cargo\.(toml|lock)|clippy\.toml)$
        pass_filenames: false
      - id: sqlx-prepare
        name: sqlx offline metadata is current
        # Needs the dev database (docker compose up -d db) and sqlx-cli. If it fails, run
        # `cargo sqlx prepare --workspace` in backend-rs/ and commit .sqlx/.
        entry: bash -c 'cd backend-rs && cargo sqlx prepare --workspace --check'
        language: system
        files: ^backend-rs/(.*\.rs|migrations/.*\.sql|\.sqlx/.*)$
        pass_filenames: false

      # Frontend (pnpm)
      - id: oxlint
        name: oxlint
        entry: bash -c 'cd frontend && pnpm exec oxlint --fix --no-error-on-unmatched-pattern "${@#frontend/}"' --
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        exclude: ^frontend/src/components/ui/
      - id: oxfmt
        name: oxfmt
        entry: bash -c 'cd frontend && pnpm exec oxfmt --no-error-on-unmatched-pattern "${@#frontend/}"' --
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|json|css|html|md)$
        exclude: ^frontend/pnpm-lock\.yaml$
      - id: tsc
        name: tsc
        entry: pnpm --dir frontend run typecheck
        language: system
        files: ^frontend/
        pass_filenames: false
