# Production stack: nginx (SPA + reverse proxy) -> Daphne -> Postgres.
#   cp .env.prod.example .env.prod   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Terminate TLS in front of `web` (Caddy, Traefik, a cloud LB, ...); Web Push and the PWA need HTTPS.
name: stowarzysz-prod

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: stowarzysz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: stowarzysz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stowarzysz"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      SECRET_SANTA_KEY: ${SECRET_SANTA_KEY:?set SECRET_SANTA_KEY}
      DATABASE_URL: postgres://stowarzysz:${POSTGRES_PASSWORD}@db:5432/stowarzysz
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
    volumes:
      - media:/data/media

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - media:/data/media:ro

volumes:
  pgdata:
  media:
