# Production stack: nginx (SPA + reverse proxy) -> Daphne -> Postgres.
#   cp .env.prod.example .env.prod   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Terminate TLS in front of `web` (Caddy, Traefik, a cloud LB, ...); Web Push and the PWA need HTTPS.
name: stowarzysz-prod

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: stowarzysz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: stowarzysz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stowarzysz"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      SECRET_SANTA_KEY: ${SECRET_SANTA_KEY:?set SECRET_SANTA_KEY}
      DATABASE_URL: postgres://stowarzysz:${POSTGRES_PASSWORD}@db:5432/stowarzysz
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
    volumes:
      - media:/data/media
    healthcheck:
      # The slim image has no curl. Django rejects hosts outside ALLOWED_HOSTS, so send the first one (or
      # localhost for a wildcard) as the Host header. start_period covers `migrate` on startup.
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request
          host = os.environ["ALLOWED_HOSTS"].split(",")[0].strip().lstrip(".")
          req = urllib.request.Request("http://127.0.0.1:8000/api/health/", headers={"Host": "localhost" if host in ("", "*") else host})
          urllib.request.urlopen(req, timeout=4)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - media:/data/media:ro
    healthcheck:
      # Only proves nginx is serving; the proxied path is checked end to end by scripts/deploy.sh.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  media:
