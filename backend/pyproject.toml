[project]
name = "backend"
version = "0.1.0"
description = "stowarzysz backend"
authors = [
    { name = "Jakub Wilk", email = "jakubwi@media-press.tv" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "daphne>=4.2.3",
    "django>=6.1.1",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-eventstream>=5.3.4",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pywebpush>=2.5.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ty.environment]
python-version = "3.14"

# ty has no Django plugin: model fields are typed as the Field object rather than the value
# (`status: CharField`, `ballot: JSONField`) and reverse relations/`<fk>_id` are unknown. Those
# rules would only report false positives for model-heavy code, so they are off for this app.
[[tool.ty.overrides]]
include = [
  "voting/**",
  "secretsanta/**",
  "pacts/**",
  "ledger/**",
  "tests/test_pact_flows.py",
]

[tool.ty.overrides.rules]
invalid-assignment = "ignore"
invalid-argument-type = "ignore"
invalid-return-type = "ignore"
unresolved-attribute = "ignore"
not-subscriptable = "ignore"
unsupported-operator = "ignore"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

# the flow tests reuse fixtures and helpers from test_pacts.py by importing them
[tool.ruff.lint.per-file-ignores]
"tests/test_pact_flows.py" = ["F401", "F811", "RUF001"]
"tests/test_pact_attachments.py" = ["F401", "F811", "RUF001"]
