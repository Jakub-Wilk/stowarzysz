server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 10m;  # avatar uploads

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Uploaded profile pictures (shared volume with the backend).
    location /api/media/ {
        alias /data/media/;
        expires 1h;
    }

    # SSE stream: must not be buffered or time out.
    location /api/events/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Service worker and manifest must always be revalidated.
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback. index.html (and anything else unhashed) is revalidated on every load, so a
    # deploy shows up on the next page load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
