# The web image for frontend-rs (replaces frontend/nginx.conf at the v2 cutover). backend-rs
# serves media itself (signed URLs), so there is no /api/media alias any more.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 55m;  # uploads (backend-rs accepts 50 MB)

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # SSE stream: must not be buffered or time out (no trailing slash in backend-rs).
    location = /api/events {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Uploads and receipt OCR stream the body straight through (backend-rs allows 10 minutes).
    location ~ ^/api/(uploads|ledger/receipt-ocr)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_request_buffering off;
        proxy_read_timeout 11m;
        proxy_send_timeout 11m;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # The Android app and its update manifest (scripts/release-apk.sh copies them into the
    # downloads volume). The manifest is always revalidated; APK names carry the version.
    location /downloads/ {
        root /data;  # /downloads/x is /data/downloads/x; nested locations inherit it
        location ~ \.json$ {
            add_header Cache-Control "no-cache";
        }
        location ~ \.apk$ {
            default_type application/vnd.android.package-archive;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # The service worker and the deployed build id must always be revalidated.
    location ~ ^/(sw\.js|version\.json)$ {
        add_header Cache-Control "no-cache";
    }

    # Content-hashed (dx), except the fonts folder, whose names never change meaning.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /wasm/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback. index.html is revalidated on every load, so a deploy shows up on the next
    # page load (and open tabs see version.json change).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
