<!doctype html>
<html lang="pl" data-theme="default">
  <head>
    <meta charset="UTF-8" />
    <title>{app_title}</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0818" />
    <script>
      // Paint the remembered theme before the wasm loads (the app applies it again once running).
      try {
        var t = localStorage.getItem('theme-override') || localStorage.getItem('theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="main"></div>
  </body>
</html>
