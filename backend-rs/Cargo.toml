[workspace]
resolver = "3"
members = ["crates/domain", "crates/app", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
app = { path = "crates/app" }

anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
chrono-tz = "0.10"
fast_image_resize = { version = "5", features = ["image"] }
flate2 = "1"
governor = "0.10"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
jsonwebtoken = "9"
pbkdf2 = "0.12"
num-bigint = "0.4"
num-integer = "0.1"
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-str"] }
rand = "0.9"
rpassword = "7"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
unicode-normalization = "0.1"
webp = "0.3"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "uuid", "json", "rust_decimal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
web-push-native = "0.4"
base64ct = { version = "1", features = ["alloc"] }
thiserror = "2"
tokio-util = { version = "0.7", features = ["io", "rt"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "compression-full", "cors", "limit", "request-id", "timeout", "trace", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
uuid = { version = "1", features = ["v4", "serde"] }
insta = { version = "1", features = ["json", "redactions"] }
proptest = { version = "1", default-features = false, features = ["std"] }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Curated pedantic: these fire constantly on idiomatic service code without catching bugs.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2  # dependencies (image codecs, argon2) are unusably slow unoptimised
